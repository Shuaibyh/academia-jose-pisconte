spring:
  application:
    name: academia-demo
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/academia_demo}
    username: ${DB_USERNAME:academia}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    placeholders:
      demo-admin-password: ${APP_DEMO_ADMIN_PASSWORD}
      demo-student-password: ${APP_DEMO_STUDENT_PASSWORD}

server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    path: ${APP_UPLOADS_PATH:uploads}
